name: Daily Adhan Scheduler
on:
  schedule:
    - cron: '0 2 * * *' # Runs at 02:00 UTC every day
  workflow_dispatch:

jobs:
  schedule-prayers:
    runs-on: ubuntu-latest
    environment: PROD
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install requests qstash pytz
        
      - name: Run Scheduler
        env:
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          SMARTTHINGS_TOKEN: ${{ secrets.SMARTTHINGS_TOKEN }}
          DEVICE_ID: ${{ secrets.DEVICE_ID }}
          LPT_API_KEY: ${{ secrets.LPT_API_KEY }}
          QSTASH_URL: ${{ vars.QSTASH_URL }}
        run: python scraper.py
